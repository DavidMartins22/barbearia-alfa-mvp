<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Alfa Concept - Agendamento</title>
    <style>
        :root {
            --primary-color: #1a1a1a;
            --accent-color: #2e7d32;
            --error-color: #c62828;
            --background-color: #f5f5f5;
            --card-color: #ffffff;
            --text-color: #212121;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-color);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1, h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
        }

        /* Acessibilidade WCAG: Alto contraste e targets de toque com mínimo de 48px */
        .btn-barbeiro, .btn-horario, .btn-submit {
            width: 100%;
            min-height: 48px; /* RNA01: Área de toque mínima expandida */
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid var(--primary-color);
            background: transparent;
            color: var(--primary-color);
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-barbeiro.active, .btn-horario.active {
            background: var(--primary-color);
            color: #ffffff;
        }

        .btn-submit {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
            margin-top: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 6px;
            color: var(--primary-color);
        }

        /* Inputs acessíveis com tamanho e contraste adequados */
        .form-control {
            width: 100%;
            min-height: 48px;
            padding: 12px;
            border: 2px solid #757575;
            border-radius: 6px;
            font-size: 16px;
            color: var(--text-color);
        }

        /* Alertas resilientes: Cor + Símbolo + Texto (Não dependem apenas de cor) */
        .alert {
            padding: 16px;
            border-radius: 6px;
            margin-top: 16px;
            display: none;
            font-weight: bold;
            align-items: center;
            gap: 8px;
        }

        .alert-success {
            background-color: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #81c784;
        }

        .alert-error {
            background-color: #ffebee;
            color: #b71c1c;
            border: 2px solid #e57373;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Barbearia Alfa Concept</h1>
    
    <!-- Fluxo 1: Seleção de Barbeiro -->
    <div id="step-1">
        <h2>Selecione o Profissional</h2>
        <button class="btn-barbeiro" onclick="selectBarbeiro(1, this)">Marcus Vinícius</button>
    </div>

    <!-- Fluxo 2: Seleção de Horário Livre -->
    <div id="step-2" class="hidden">
        <h2>Escolha o Horário</h2>
        <div id="horarios-container">
            <button class="btn-horario" onclick="selectHorario('2026-11-21T14:00:00', this)">Sábado - 14:00h</button>
            <button class="btn-horario" onclick="selectHorario('2026-11-21T15:30:00', this)">Sábado - 15:30h</button>
            <button class="btn-horario" onclick="selectHorario('2026-11-21T18:00:00', this)">Sábado - 18:00h</button>
        </div>
    </div>

    <!-- Fluxo 3: Formulário Final -->
    <div id="step-3" class="hidden">
        <h2>Seus Dados</h2>
        <div class="form-group">
            <label for="nome_cliente">Nome Completo</label>
            <input type="text" id="nome_cliente" class="form-control" placeholder="Ex: Carlos Silva">
        </div>
        <div class="form-group">
            <label for="telefone_cliente">Telefone Celular</label>
            <input type="tel" id="telefone_cliente" class="form-control" placeholder="Ex: (11) 98765-4321">
        </div>
        <button class="btn-submit" onclick="confirmarAgendamento()">Confirmar Agendamento</button>
    </div>

    <!-- Sistema de Alertas Redundantes (WCAG) -->
    <div id="alert-success" class="alert alert-success">
        <span>✔</span> <strong>Sucesso!</strong> Agendamento confirmado com "zero-fricção".
    </div>
    <div id="alert-error" class="alert alert-error">
        <span>✖</span> <strong>Erro:</strong> <span id="error-message">Colisão de horários detectada!</span>
    </div>
</div>

<script>
    let agendamentoDados = {
        barbeiro_id: null,
        data_hora: null,
        nome_cliente: "",
        telefone_cliente: ""
    };

    function selectBarbeiro(id, element) {
        agendamentoDados.barbeiro_id = id;
        document.querySelectorAll('.btn-barbeiro').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('step-2').classList.remove('hidden');
    }

    function selectHorario(isoString, element) {
        agendamentoDados.data_hora = isoString;
        document.querySelectorAll('.btn-horario').forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('step-3').classList.remove('hidden');
    }

    async function confirmarAgendamento() {
        agendamentoDados.nome_cliente = document.getElementById('nome_cliente').value;
        agendamentoDados.telefone_cliente = document.getElementById('telefone_cliente').value;

        // Oculta alertas anteriores
        document.getElementById('alert-success').style.display = 'none';
        document.getElementById('alert-error').style.display = 'none';

        try {
            const response = await fetch('/agendamentos/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(agendamentoDados)
            });

            if (response.ok) {
                document.getElementById('alert-success').style.display = 'flex';
                document.getElementById('step-3').classList.add('hidden');
            } else {
                const errData = await response.json();
                document.getElementById('error-message').innerText = errData.detail || "Erro operacional.";
                document.getElementById('alert-error').style.display = 'flex';
            }
        } catch (error) {
            document.getElementById('error-message').innerText = "Erro de conexão de rede.";
            document.getElementById('alert-error').style.display = 'flex';
        }
    }
</script>

</body>
</html>
